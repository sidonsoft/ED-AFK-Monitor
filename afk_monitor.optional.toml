# AFK Monitor Optional Config
# 
# This file contains optional settings that can be used in afk_monitor.toml
# 
# SETTINGS HERE ARE FOR INFO ONLY - THIS FILE IS NOT LOADED BY AFK MONITOR!
# 
# To modify/use a setting, copy and paste it under [Settings] in afk_monitor.toml

[Settings]
# RecentFiles specifies number of files to show with --fileselect (default: 10)
RecentFiles = 10
# TruncatePirate shortens names of pirates above this length in kill logs (default: 25)
TruncatePirate = 25
# TruncateFaction shortens names of factions above this length in kill logs (default: 30)
TruncateFaction = 30
# WarnNoKillsInitial is the time in minutes before warning of no kills at session start (default: 5)
WarnNoKillsInitial = 5
# WarnKillRateDelay is the time in minutes before warning of low kill rate at session start (default: 5)
WarnKillRateDelay = 5
# WarnCooldown is the time in minutes before repeating kill rate warnings, doubled thereafter (default: 30)
WarnCooldown = 30
# WatchdogSeconds: how often time-based checks run while idle: kill-rate/no-kill
# warnings, mission expiry alerts and mid-session relay pushes (default: 60)
WatchdogSeconds = 60
# RecentIntervals is a list of numbers in minutes to calculate recent hourly rates for (default: [15, 30, 60])
RecentIntervals = [15, 30, 60]
# WinTitleCmdrName prepends commander name to the window title (Default: false, requires DynamicTitle = true)
WinTitleCmdrName = false
# Repo selects the GitHub repository checked for update notifications (Default: "sidonsoft/ED-AFK-Monitor")
# Set to "PsiPab/ED-AFK-Monitor" to track the original releases, or point it at your own fork
Repo = 'sidonsoft/ED-AFK-Monitor'
# ShipsFile points at a JSON file with "easy"/"hard" ship pools used for scan and kill classification
# (Default: ships.json next to AFK Monitor; edit that file after game updates without touching code)
ShipsFile = 'ships.json'
# AlertSound plays a local sound for level-3 alerts: 'bell' (terminal bell), 'beep' or a .wav
# file path (Windows only), or 'none' (default) for silence
AlertSound = 'none'
# HistoryDays keeps saved sessions (for --history) this many days old (Default: 90, 0 disables pruning)
HistoryDays = 90
# WarnMissionExpiry warns in minutes before an unfinished mission expires (Default: 15, 0 disables)
# Already-expired-but-still-open missions are reported once as well; log level 'MissionExpiry' in [LogLevels]
WarnMissionExpiry = 15

# =====================
# Status line
# =====================
# Default status line uses a full-width, near-white on dark-gray line

# StatusPadChar specifies a character for padding the width of the terminal (default: " ", use "" for no padding)
StatusPadChar = " "
# StatusColBG/FG specify ANSI colour codes for the background and foreground colours of the status line
# Standard ANSI codes are supported, allowing for 256 colour or full RGB depending on your terminal
# For RGB use "2;R;G;B", where R/G/B are numbers 0-255, e.g: "2;255;0;0" for bright red
StatusColBG = "5;236"   # Default: "5;236", use "" to disable and use terminal default
StatusColFG = "5;254"   # Default: "5;254", use "" to disable and use terminal default
# StatusSafeMargin is a safety margin in characters to leave at the end of the status line (Default: 2)
StatusSafeMargin = 2
