name: Release builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-builds-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    # Accept reviewed main or maintainer-created version tags, never PR refs.
    if: github.repository == 'sidonsoft/ED-AFK-Monitor' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: Bundle ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows x64
            runner: [dell-sidonsoft-windows-x64]
            binary: ed-afk-monitor-windows
          - platform: Linux x64
            runner: [dell-sidonsoft-linux-x64]
            binary: ed-afk-monitor-linux
          - platform: macOS ARM64
            runner: [ed-afk-trusted-macos-arm64]
            binary: ed-afk-monitor-macos
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Create a fresh build environment
        shell: bash
        run: |
          build_env="${RUNNER_TEMP}/ed-afk-release-${{ matrix.binary }}"
          uv venv --managed-python --python 3.12 --seed "$build_env"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "$build_env/Scripts" >> "$GITHUB_PATH"
          else
            echo "$build_env/bin" >> "$GITHUB_PATH"
          fi
      - name: Install build dependencies
        run: python -m pip install pyinstaller discord-webhook pillow
      - name: Run regression tests before bundling
        run: python -m unittest discover -s tests -v
      - name: Bundle executable
        shell: bash
        run: |
          sep=":"
          [ "$RUNNER_OS" = "Windows" ] && sep=";"
          python -m PyInstaller --onefile --name "${{ matrix.binary }}" \
            --add-data "ships.json${sep}." afk_monitor.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}*
          if-no-files-found: error
      - name: Remove temporary build environment
        if: always()
        shell: bash
        run: rm -rf -- "${RUNNER_TEMP}/ed-afk-release-${{ matrix.binary }}"

  publish:
    name: Attach verified builds to release
    needs: bundle
    # always(): one flaky self-hosted bundle (e.g. a runner setup hook that
    # died before any step) must not strand an otherwise-verified release;
    # the guard below still refuses to publish a husk of a build set
    if: always() && github.repository == 'sidonsoft/ED-AFK-Monitor' && startsWith(github.ref, 'refs/tags/v') && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: ed-afk-monitor-*
          merge-multiple: true
          path: dist
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          built=$(find dist -maxdepth 1 -type f | wc -l)
          if [ "$built" -lt 2 ]; then
            echo "::error::refusing to publish $GITHUB_REF_NAME with only $built asset(s)"
            exit 1
          fi
          for want in ed-afk-monitor-windows ed-afk-monitor-macos ed-afk-monitor-linux; do
            if ! ls dist/"$want"* >/dev/null 2>&1; then
              echo ":warning: $want did not build; release ships without it" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
          done
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "ED AFK Monitor $GITHUB_REF_NAME" --generate-notes --latest
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
