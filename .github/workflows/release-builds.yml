name: Release builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: ed-afk-monitor-windows
          - os: ubuntu-latest
            binary: ed-afk-monitor-linux
          - os: macos-latest
            binary: ed-afk-monitor-macos
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install pyinstaller discord-webhook pillow
      - name: Bundle executable
        shell: bash
        run: |
          sep=":"
          [ "$RUNNER_OS" = "Windows" ] && sep=";"
          pyinstaller --onefile --name "${{ matrix.binary }}" \
            --add-data "ships.json${sep}." \
            afk_monitor.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pushed tag is not a release; the first job to arrive creates it
          # (the others harmlessly lose the race and just upload).
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "ED AFK Monitor ${GITHUB_REF_NAME}" \
            --generate-notes --latest 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" dist/${{ matrix.binary }}* --clobber
