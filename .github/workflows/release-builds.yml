name: Release builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: Bundle ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            binary: ed-afk-monitor-windows
          - os: ubuntu-latest
            binary: ed-afk-monitor-linux
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: pip install pyinstaller discord-webhook pillow
      - name: Bundle executable
        shell: bash
        run: |
          sep=":"
          [ "$RUNNER_OS" = "Windows" ] && sep=";"
          pyinstaller --onefile --name "${{ matrix.binary }}" \
            --add-data "ships.json${sep}." \
            afk_monitor.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: dist/${{ matrix.binary }}*
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pushed tag is not a release; the first job to arrive creates it
          # (the others harmlessly lose the race and just upload).
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "ED AFK Monitor ${GITHUB_REF_NAME}" \
            --generate-notes --latest 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" dist/${{ matrix.binary }}* --clobber

  macos:
    # Dedicated trusted runner: hosted macos pools queue for an hour and
    # the runner already builds this binary daily in trusted-macos.yml.
    # uv provides managed Python because the runner account is non-admin.
    name: Bundle macos
    runs-on: [ed-afk-trusted-macos-arm64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Fresh build environment
        run: |
          uv venv --managed-python --python 3.12 --seed "${RUNNER_TEMP}/ed-afk-build"
          echo "${RUNNER_TEMP}/ed-afk-build/bin" >> "$GITHUB_PATH"
      - name: Install build dependencies
        run: python -m pip install pyinstaller discord-webhook pillow
      - name: Bundle executable
        run: python -m PyInstaller --onefile --name ed-afk-monitor-macos --add-data "ships.json:." afk_monitor.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ed-afk-monitor-macos
          path: dist/ed-afk-monitor-macos
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "ED AFK Monitor ${GITHUB_REF_NAME}" \
            --generate-notes --latest 2>/dev/null || true
          gh release upload "${GITHUB_REF_NAME}" dist/ed-afk-monitor-macos --clobber
      - name: Remove build environment
        if: always()
        run: /usr/bin/python3 -c "import os, shutil; shutil.rmtree(os.path.join(os.environ['RUNNER_TEMP'], 'ed-afk-build'), ignore_errors=True)"
