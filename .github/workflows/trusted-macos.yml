name: Trusted Mac builds

on:
  push:
    branches: [main, ci/trusted-macos-runner]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trusted-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    # PR checks stay in tests.yml on GitHub-hosted runners. Never check out a PR here.
    if: github.repository == 'sidonsoft/ED-AFK-Monitor' && (github.ref == 'refs/heads/main' || (github.ref == 'refs/heads/ci/trusted-macos-runner' && github.actor == 'sidonsoft')) && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    name: Trusted macOS ARM64 / Python ${{ matrix.python }}
    runs-on: [ed-afk-trusted-macos-arm64]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          clean: true
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.5'
          enable-cache: false
      - name: Create a fresh build environment
        run: |
          uv venv --managed-python --python "${{ matrix.python }}" --seed "${RUNNER_TEMP}/ed-afk-${{ matrix.python }}"
          echo "${RUNNER_TEMP}/ed-afk-${{ matrix.python }}/bin" >> "$GITHUB_PATH"
      - name: Install test dependency
        run: python -m pip install pillow
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Build macOS ARM64 executable
        if: matrix.python == '3.12'
        run: |
          python -m pip install pyinstaller discord-webhook
          python -m PyInstaller --onefile --name ed-afk-monitor-macos-arm64 --add-data "ships.json:." afk_monitor.py
      - name: Save macOS ARM64 build
        if: matrix.python == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ed-afk-monitor-macos-arm64-trusted
          path: dist/ed-afk-monitor-macos-arm64
          if-no-files-found: error
          retention-days: 7
      - name: Remove temporary build environment
        if: always()
        run: |
          /usr/bin/python3 -c "import os, shutil; shutil.rmtree(os.path.join(os.environ['RUNNER_TEMP'], 'ed-afk-${{ matrix.python }}'), ignore_errors=True)"
