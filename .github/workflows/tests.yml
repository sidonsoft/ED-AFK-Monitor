name: Dell Linux runner smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    if: github.repository == 'sidonsoft/ED-AFK-Monitor' && github.actor == 'sidonsoft' && github.ref == 'refs/heads/ci/dell-runner-smoke'
    runs-on: [dell-ed-afk-linux-x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Check runner isolation
        shell: bash
        run: |
          set -eu
          test "$(id -u)" -ne 0
          ! sudo -n true 2>/dev/null
          ! test -w /etc/edafk-runner/trusted-linux-job.sh
          ! test -w /home/runner/actions-runner/bin/Runner.Listener
          ! findmnt -rn -t 9p,virtiofs,cifs
          python3 --version
      - name: Run full credential-free regression suite
        shell: bash
        run: |
          set -eu
          python3 -m venv .venv
          .venv/bin/python -m pip install '.[discord,card]'
          .venv/bin/python -m unittest discover -s tests -v
      - name: Build Linux executable
        shell: bash
        run: |
          set -eu
          .venv/bin/python -m pip install pyinstaller
          .venv/bin/pyinstaller --onefile --name ed-afk-monitor-linux --add-data 'ships.json:.' afk_monitor.py
          test -x dist/ed-afk-monitor-linux
          file dist/ed-afk-monitor-linux
