name: Regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      reason:
        description: why a manual re-run happened
        required: false
        default: ""

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # timeout-minutes includes QUEUE time, and a busy pool can hold jobs
    # queued for an hour. Cancelled-before-start jobs never reach the retry
    # wrapper (nothing runs), so the budget must absorb realistic queueing;
    # healthy suites still finish in ~3 minutes.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # macOS coverage runs on the dedicated trusted runner
        # (trusted-macos.yml); hosted macos pools are congestion-prone
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional extras used by card rendering
        run: python -m pip install pillow
      - name: Run regression tests without notification credentials
        run: python -m unittest discover -s tests -v
