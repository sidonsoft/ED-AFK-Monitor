name: Regression tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # rerun-failed-jobs on this run id (needs actions: write)

jobs:
  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # counts queue time too: congested macos pools exceed 10
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional extras used by card rendering
        run: python -m pip install pillow
      - name: Run regression tests without notification credentials
        run: python -m unittest discover -s tests -v

      - name: Retry jobs cancelled by runner-pool eviction
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # macOS pool congestion cancels queued jobs before any step runs
          # (zero logs). One targeted re-request per run; this wrapper run
          # reports success once the retry is at least in flight.
          attempt=$(gh api repos/${{ github.repository }}/actions/runs/${{ github.run_id }} -q .run_attempt)
          if [ "$attempt" -ge 2 ]; then exit 0; fi  # the retried run trusts its own results
          own="Python ${{ matrix.python }} on ${{ matrix.os }}"
          sleep 20
          for i in $(seq 1 40); do
            statuses=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs?per_page=100" \
              --jq '.check_runs[] | select(.name | startswith("Python")) | .name + " " + .status + " " + .conclusion')
            # this very job is still running while we wait; never block on it
            if ! grep -v "^$own " <<<"$statuses" | grep -q ' in_progress\| queued'; then break; fi
            sleep 30
          done
          if grep -q ' cancelled' <<<"$statuses"; then
            if gh api -X POST "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/rerun-failed-jobs" \
              >/dev/null; then
              echo "::notice::re-ran cancelled jobs in this run (attempt increments)"
            else
              echo "::warning::could not re-run cancelled jobs (exit stays honest)"
              exit 1
            fi
            # stay green: the retried attempt (run_attempt>=2) reports honestly
          fi
